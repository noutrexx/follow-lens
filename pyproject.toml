[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: relying on ruff's defaults means a new release can fail CI
# on code that never changed. The inline noqa comments cover the rest.
# E4/E7/E9 rather than all of E: the HTML template legitimately has long lines.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Translations: dotless i, full-width CJK punctuation and typographic dashes are
# exactly the characters these strings are supposed to contain.
"backend/i18n.py" = ["RUF001"]
